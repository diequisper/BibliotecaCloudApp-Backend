version: '3.8'

services:
  web:
    image: diegeauq/daan_proyecto:api
    ports:
      - "5000:44374"
    depends_on:
      - db
    environment:
      ASPNETCORE_URLS: "http://+:44374"
      ConnectionStrings__cn: "Server=db;Database=dbbteca;User Id=sa;Password=${DB_PASSWORD}"

  db:
    image: diegeauq/daan_proyecto:db
    environment:
      SA_PASSWORD: "${DB_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:


